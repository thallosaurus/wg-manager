name: "Build Frontend"
description: "Build Frontend Daemon"

runs:
  using: "composite"
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.7.7
    - name: Bundle Typescript
      shell: bash
      run: |
        echo '#!/usr/bin/env -S deno -A' > bundle.js
        deno bundle main.tsx >> bundle.js
        chmod +x bundle.js
    - name: Bundle Deno
      shell: bash
      run: deno compile -A --target aarch64-unknown-linux-gnu --output wgm
    - uses: actions/upload-artifact@v4
      with:
        name: wgm
        path: wgm