name: Build Raspberry Pi

on:
    workflow_dispatch:
#  push:

#    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y wireguard-tools
      - uses: ./.github/actions/wgmd
      - uses: ./.github/actions/frontend
      - uses: ./.github/actions/dpkg